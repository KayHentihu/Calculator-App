<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator-App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Calculator App</h1>
      <div class="display">0</div>
      <section class="entry_pad">
        <button>7</button> <button>8</button> <button>9</button>
        <button class="operator">+</button> <button>4</button>
        <button>5</button> <button>6</button>
        <button class="operator">-</button> <button>1</button>
        <button>2</button> <button>3</button>
        <button class="operator">/</button> <button>0</button>
        <button class="clear">C</button> <button class="all_clear">AC</button>
        <button class="equals">=</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
